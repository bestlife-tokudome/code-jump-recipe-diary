<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Recipe Diary</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="main-visual" class="main-visual wrapper">
        <img class="main-visual__image" src="img/mainvisual.jpg">
    </div>

    <section class="text-area wrapper">
        <div class="text-area__container">
            <h1 class="text-area__title">Recipe Diary</h1>
            <p class="text-area__text">
                日々の料理レシピをまとめています。
                <br>
                和食や洋食、中華、お菓子までいろいろな料理レシピをアップしていますので、
                <br>
                みなさんの献立にお役立てくださいね！
            </p>
        </div>
    </section>

    <div class="recipe-list wrapper">
        <div class="recipe-list__container">
            <div class="recipe-list__image">
                <img src="img/recipe1.jpg">
                <img src="img/recipe2.jpg">
                <img src="img/recipe3.jpg">
            </div>
            <a class="recipe-list__link" href="#">レシピ一覧を見る</a>
        </div>
    </div>

    <footer class="footer">
        <div class="footer__sns-list">
            <a class="footer__instagram" href="#">Instagram</a>
            <a class="footer__twitter" href="#">Twitter</a>
            <a class="footer__facebook" href="#">Facebook</a>
        </div>
        <p class="footer__copyright">&copy; 2026 Recipe Diary</p>
    </footer>
</body>

</html>
